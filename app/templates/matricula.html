<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Matrícula | Alfa Cursos
    </title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <!-- ========================= -->
    <!-- FORMULÁRIO -->
    <!-- ========================= -->

    <section class="matricula-section">

        <div class="matricula-container">

            <h1>
                Faça sua Matrícula
            </h1>

            <p>
                Preencha os dados abaixo para iniciar sua jornada.
            </p>

            <form action="/matricula" method="POST" onsubmit="return validarCPF() && validarRG() && validarEmail()">

                

                <!-- ========================= -->
                <!-- RESPONSÁVEL -->
                <!-- ========================= -->

                <h2>
                    Dados do Responsável
                </h2>

                <!-- NOME -->
                <div class="form-group">

                    <label>
                        Nome Completo
                    </label>

                    <input
                        type="text"
                        name="nome_responsavel"
                        placeholder="Digite o nome do responsável"
                        required
                    >

                </div>

                <!-- CPF -->
                <div class="form-group">

                    <label>
                        CPF
                    </label>

                    <input
                        type="text"
                        name="cpf"
                        id="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        required
                        oninput="formatarCPF(this)"
                    >

                    <small

                        id="cpfErro"
                        style ="
                        color: red;
                        display: none;
                        margin-top: 5px;
                        "
                    >
                        CPF inválido
                    </small>

                    
                </div>

                <!-- RG -->
                <div class="form-group">

                    <label>
                        RG
                    </label>

                    <input
                        type="text"
                        name="rg"
                        id="rg"
                        placeholder="00.000.000-0"
                        maxlength="12"
                        required
                        oninput="formatarRG(this)"
                    >

                    <small
                        id="rgErro"
                        style="
                            color: red;
                            display: none;
                            margin-top: 5px;
                        "
                    >
                        RG inválido.
                    </small>

                </div>

                <!-- EMAIL -->
                <div class="form-group">

                    <label>
                        E-mail
                    </label>

                    <input
                        type="email"
                        name="email"
                        id="email"
                        placeholder="Digite o e-mail"
                        required
                    >
                    
                    <small
                        id="emailErro"
                        style="
                            color: red;
                            display: none;
                            margin-top: 5px;
                        "
                    >
                        E-mail inválido.
                    </small>

                </div>

                <!-- TELEFONE -->
                <div class="form-group">

                    <label>
                        Telefone
                    </label>

                    <input
                        type="text"
                        name="telefone"
                        placeholder="(12) 98765-4321"
                        maxlength="15"
                        required
                        oninput="formatarTelefone(this)"
                    >

                </div>

                <!-- DATA NASCIMENTO -->
                <div class="form-group">

                    <label>
                        Data de Nascimento
                    </label>

                    <input
                        type="date"
                        name="data_nascimento_responsavel"
                        required
                    >

                </div>

                <!-- CEP -->
                <div class="form-group">

                    <label>
                        CEP
                    </label>

                    <input
                        type="text"
                        name="cep"
                        id="cep"
                        placeholder="00000-000"
                        maxlength="9"
                        required
                        oninput="formatarCEP(this)"
                    >

                </div>

                <!-- RUA -->
                <div class="form-group">

                    <label>
                        Rua
                    </label>

                    <input
                        type="text"
                        name="rua"
                        id="rua"
                        placeholder="A rua será preenchida automaticamente"
                        readonly
                        required
                    >

                </div>

                <!-- NÚMERO -->
                <div class="form-group">

                    <label>
                        Número
                    </label>

                    <input
                        type="text"
                        name="numero"
                        placeholder="Digite o número"
                        required
                    >

                </div>

                <!-- COMPLEMENTO -->
                <div class="form-group">

                    <label>
                        Complemento
                    </label>

                    <input
                        type="text"
                        name="complemento"
                        placeholder="Apartamento, bloco, etc"
                    >
                </div>

                <!-- ========================= -->
                <!-- DADOS DOS ALUNOS -->
                <!-- ========================= -->

                <div id="alunos-container">

                    <div class="aluno-bloco">

                        <h2>
                            Dados do Aluno
                        </h2>

                        <!-- NOME -->
                        <div class="form-group">

                            <label>
                                Nome Completo
                            </label>

                            <input
                                type="text"
                                name="nome_aluno[]"
                                placeholder="Digite o nome do aluno"
                                required
                            >

                        </div>

                        <!-- NASCIMENTO -->
                        <div class="form-group">

                            <label>
                                Data de Nascimento
                            </label>

                            <input
                                type="date"
                                name="data_nascimento_aluno[]"
                                required
                            >

                        </div>

                        <!-- CURSO -->
                        <div class="form-group">

                            <label>
                                Curso Desejado
                            </label>

                            <select
                                name="curso[]"
                                class="curso-select"
                                required
                            >

                                <option value="">
                                    Selecione um curso
                                </option>

                                <option value="1">
                                    Informática Básica
                                </option>

                                <option value="2">
                                    Informática Completa
                                </option>

                                <option value="3">
                                    Informática VIP
                                </option>

                                <option value="4">
                                    Inglês
                                </option>

                                <option value="5">
                                    Reforço Escolar
                                </option>

                                <option value="6">
                                    Preparatório Embraer
                                </option>

                                <option value="7">
                                    Preparatório ENEM
                                </option>

                                <option value="8">
                                    Alfabetização
                                </option>

                            </select>

                        </div>

                        <!-- HORÁRIO -->
                        <div class="form-group">

                            <label>
                                Horário
                            </label>

                            <select
                                name="horario[]"
                                class="horario-select"
                                required
                            >

                                <option value="">
                                    Selecione um horário
                                </option>

                            </select>

                        </div>

                    </div>

                </div>

                <button
                    type="button"
                    id="adicionarAluno"
                    class="btn-form"
                >
                    + Adicionar Outro Aluno
                </button>                          

                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="btn-form"
                >

                    Finalizar Matrícula

                </button>

            </form>

        </div>

    </section>

    <!-- ========================= -->
    <!-- RODAPÉ -->
    <!-- ========================= -->

    <footer class="footer">

        <p>
            © 2026 Alfa Cursos - Todos os direitos reservados
        </p>

    </footer>

    <script src="{{ url_for('static', filename='js/matricula.js') }}"></script>

</body>

</html>
