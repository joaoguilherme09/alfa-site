<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Matrícula | Alfa Cursos
    </title>

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>

<body>

    <!-- ========================= -->
    <!-- FORMULÁRIO -->
    <!-- ========================= -->

    <section class="matricula-section">

        <div class="matricula-container">

            <h1>
                Faça sua Matrícula
            </h1>

            <p>
                Preencha os dados abaixo para iniciar sua jornada.
            </p>

            <form action="/matricula" method="POST" onsubmit="return validarCPF() && validarRG">

                <!-- ========================= -->
                <!-- DADOS DO ALUNO -->
                <!-- ========================= -->

                <h2>
                    Dados do Aluno
                </h2>

                <!-- NOME -->
                <div class="form-group">

                    <label>
                        Nome Completo
                    </label>

                    <input
                        type="text"
                        name="nome_aluno"
                        placeholder="Digite o nome do aluno"
                        required
                    >

                </div>

                <!-- DATA NASCIMENTO -->
                <div class="form-group">

                    <label>
                        Data de Nascimento
                    </label>

                    <input
                        type="date"
                        name="data_nascimento_aluno"
                        required
                    >

                </div>

                <!-- ========================= -->
                <!-- RESPONSÁVEL -->
                <!-- ========================= -->

                <h2>
                    Dados do Responsável
                </h2>

                <!-- NOME -->
                <div class="form-group">

                    <label>
                        Nome Completo
                    </label>

                    <input
                        type="text"
                        name="nome_responsavel"
                        placeholder="Digite o nome do responsável"
                        required
                    >

                </div>

                <!-- CPF -->
                <div class="form-group">

                    <label>
                        CPF
                    </label>

                    <input
                        type="text"
                        name="cpf"
                        id="cpf"
                        placeholder="000.000.000-00"
                        maxlength="14"
                        required
                        oninput="formatarCPF(this)"
                    >

                    <small

                        id="cpfErro"
                        style ="
                        color: red;
                        display: none;
                        margin-top: 5px;
                        "
                    >
                        CPF inválido
                    </small>

                    <small
                        id="rgErro"
                        style="
                            color: red;
                            display: none;
                            margin-top: 5px;
                        "
                    >
                        RG inválido.
                    </small>
                </div>

                <!-- RG -->
                <div class="form-group">

                    <label>
                        RG
                    </label>

                    <input
                        type="text"
                        name="rg"
                        id="rg"
                        placeholder="00.000.000-0"
                        maxlength="12"
                        required
                        oninput="formatarRG(this)"
                    >

                </div>

                <!-- EMAIL -->
                <div class="form-group">

                    <label>
                        E-mail
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Digite o e-mail"
                        required
                    >

                </div>

                <!-- TELEFONE -->
                <div class="form-group">

                    <label>
                        Telefone
                    </label>

                    <input
                        type="text"
                        name="telefone"
                        placeholder="(12) 98765-4321"
                        maxlength="15"
                        required
                        oninput="formatarTelefone(this)"
                    >

                </div>

                <!-- DATA NASCIMENTO -->
                <div class="form-group">

                    <label>
                        Data de Nascimento
                    </label>

                    <input
                        type="date"
                        name="data_nascimento_responsavel"
                        required
                    >

                </div>

                <!-- CEP -->
                <div class="form-group">

                    <label>
                        CEP
                    </label>

                    <input
                        type="text"
                        name="cep"
                        id="cep"
                        placeholder="00000-000"
                        maxlength="9"
                        required
                        oninput="formatarCEP(this)"
                    >

                </div>

                <!-- RUA -->
                <div class="form-group">

                    <label>
                        Rua
                    </label>

                    <input
                        type="text"
                        name="rua"
                        id="rua"
                        placeholder="A rua será preenchida automaticamente"
                        readonly
                        required
                    >

                </div>

                <!-- NÚMERO -->
                <div class="form-group">

                    <label>
                        Número
                    </label>

                    <input
                        type="text"
                        name="numero"
                        placeholder="Digite o número"
                        required
                    >

                </div>

                <!-- COMPLEMENTO -->
                <div class="form-group">

                    <label>
                        Complemento
                    </label>

                    <input
                        type="text"
                        name="complemento"
                        placeholder="Apartamento, bloco, etc"
                    >
                </div>

                <!-- ========================= -->
                <!-- MATRÍCULA -->
                <!-- ========================= -->

                <h2>
                    Dados da Matrícula
                </h2>

                <!-- CURSO -->
                <div class="form-group">

                    <label>
                        Curso Desejado
                    </label>

                    <select
                        name="curso"
                        required
                    >

                        <option value="">
                            Selecione um curso
                        </option>

                        <option value="1">
                            Informática Básica
                        </option>

                        <option value="2">
                            Informática Completa
                        </option>

                        <option value="3">
                            Informática VIP
                        </option>

                        <option value="4">
                            Inglês
                        </option>

                        <option value="5">
                            Reforço Escolar
                        </option>

                        <option value="6">
                            Preparatório Embraer
                        </option>

                        <option value="7">
                            Preparatório ENEM
                        </option>

                        <option value="8">
                            Alfabetização
                        </option>

                    </select>

                </div>

                <!-- HORÁRIO -->
                <div class="form-group">

                    <label>
                        Horário
                    </label>

                    <select
                        name="horario"
                        required
                    >

                        <option value="">
                            Selecione um horário
                        </option>

                    </select>

                </div>

                <!-- BOTÃO -->
                <button
                    type="submit"
                    class="btn-form"
                >

                    Finalizar Matrícula

                </button>

            </form>

        </div>

    </section>

    <!-- ========================= -->
    <!-- RODAPÉ -->
    <!-- ========================= -->

    <footer class="footer">

        <p>
            © 2026 Alfa Cursos - Todos os direitos reservados
        </p>

    </footer>

    <script>

        function formatarTelefone(input) {

            let telefone = input.value;

            telefone = telefone.replace(/\D/g, '');

            telefone = telefone.substring(0, 11);

            telefone = telefone.replace(
                /^(\d{2})(\d)/g,
                '($1) $2'
            );

            telefone = telefone.replace(
                /(\d{5})(\d)/,
                '$1-$2'
            );

            input.value = telefone;
        }

        function formatarCPF(input) {

            let cpf = input.value;

            cpf = cpf.replace(/\D/g, '');

            cpf = cpf.substring(0, 11);

            cpf = cpf.replace(
                /(\d{3})(\d)/,
                '$1.$2'
            );

            cpf = cpf.replace(
                /(\d{3})(\d)/,
                '$1.$2'
            );

            cpf = cpf.replace(
                /(\d{3})(\d{1,2})$/,
                '$1-$2'
            );

            input.value = cpf;
        }

        function formatarCEP(input) {

            let cep = input.value;

            cep = cep.replace(/\D/g, '');

            cep = cep.substring(0, 8);

            cep = cep.replace(
                /(\d{5})(\d)/,
                '$1-$2'
            );

            input.value = cep;
        }

        
        

        const horarios = {

            // Informática Básica
            1: [
                { id: 4, descricao: 'Segunda a Sábado - 09h às 11h' },
                { id: 5, descricao: 'Segunda a Sábado - 14h às 16h' },
                { id: 6, descricao: 'Segunda a Sábado - 16h às 18h' },
                { id: 7, descricao: 'Terça e Quinta - 18h às 20h' }
            ],

            // Informática Completa
            2: [
                { id: 8, descricao: 'Segunda a Sábado - 09h às 11h' },
                { id: 9, descricao: 'Segunda a Sábado - 14h às 16h' },
                { id: 10, descricao: 'Segunda a Sábado - 16h às 18h' },
                { id: 11, descricao: 'Terça e Quinta - 18h às 20h' }
            ],

            // Informática VIP
            3: [
                { id: 12, descricao: 'Segunda a Sábado - 09h às 11h' },
                { id: 13, descricao: 'Segunda a Sábado - 14h às 16h' },
                { id: 14, descricao: 'Segunda a Sábado - 16h às 18h' },
                { id: 15, descricao: 'Terça e Quinta - 18h às 20h' }
            ],

            // Inglês
            4: [
                { id: 1, descricao: 'Terça a Sexta - 09h às 11h' },
                { id: 2, descricao: 'Segunda a Quinta - 14h às 16h' },
                { id: 3, descricao: 'Terça e Quinta - 19h às 20h' }
            ],

            // Reforço Escolar
            5: [
                { id: 20, descricao: 'Segunda a Sexta - 09h às 11h' },
                { id: 21, descricao: 'Sábado - 09h às 12h' },
                { id: 22, descricao: 'Segunda a Sexta - 14h às 16h' },
                { id: 23, descricao: 'Terça e Quinta - 18h às 20h' }
            ],

            // Preparatório Embraer
            6: [
                { id: 17, descricao: 'Segunda, Quarta e Sexta - 16h às 18h' },
                { id: 18, descricao: 'Terça, Quinta e Sexta - 14h às 16h' },
                { id: 19, descricao: 'Terça, Quinta e Sexta - 16h às 18h' }
            ],

            // Preparatório ENEM
            7: [
                { id: 16, descricao: 'Segunda, Quarta e Sexta - 18h às 20h' }
            ],

            // Alfabetização
            8: [
                { id: 24, descricao: 'Segunda a Sexta - 09h às 11h' },
                { id: 25, descricao: 'Sábado - 09h às 12h' },
                { id: 26, descricao: 'Segunda a Sexta - 14h às 16h' },
                { id: 27, descricao: 'Terça e Quinta - 18h às 20h' }
            ]

        };
        const cursoSelect = document.querySelector('select[name="curso"]');

        const horarioSelect = document.querySelector('select[name="horario"]');

        cursoSelect.addEventListener('change', function () {

            const cursoId = this.value;

            horarioSelect.innerHTML = `
                <option value="">
                    Selecione um horário
                </option>
            `;

            if (horarios[cursoId]) {

                horarios[cursoId].forEach(function (horario) {

                    horarioSelect.innerHTML += `
                        <option value="${horario.id}">
                            ${horario.descricao}
                        </option>
                    `;
                });
            }
        });

        document
            .getElementById('cep')
            .addEventListener('blur', buscarCEP);

        async function buscarCEP() {

            let cep = document.getElementById('cep').value;

            cep = cep.replace(/\D/g, '');

            if (cep.length !== 8) {
                return;
            }

            try {

                const response = await fetch(
                    `https://viacep.com.br/ws/${cep}/json/`
                );

                const dados = await response.json();

                if (dados.erro) {

                    alert('CEP não encontrado.');

                    document.getElementById('rua').value = '';

                    return;
                }

                document.getElementById('rua').value =
                    dados.logradouro;

            }

            catch (erro) {

                console.error(erro);

                alert('Erro ao consultar CEP.');

            }
        }


        function validarCPF() {

            const campoCPF =
                document.getElementById('cpf');

            const erroCPF =
                document.getElementById('cpfErro');

            let cpf = campoCPF.value;

            cpf = cpf.replace(/\D/g, '');

            campoCPF.style.border = '';
            erroCPF.style.display = 'none';

            if (cpf.length !== 11) {

                campoCPF.style.border =
                    '2px solid red';

                erroCPF.style.display =
                    'block';

                return false;
            }

            if (/^(\d)\1+$/.test(cpf)) {

                campoCPF.style.border =
                    '2px solid red';

                erroCPF.style.display =
                    'block';

                return false;
            }

            let soma = 0;

            for (let i = 0; i < 9; i++) {

                soma +=
                    parseInt(cpf.charAt(i))
                    * (10 - i);
            }

            let resto = 11 - (soma % 11);

            if (resto >= 10) {
                resto = 0;
            }

            if (
                resto !==
                parseInt(cpf.charAt(9))
            ) {

                campoCPF.style.border =
                    '2px solid red';

                erroCPF.style.display =
                    'block';

                return false;
            }

            soma = 0;

            for (let i = 0; i < 10; i++) {

                soma +=
                    parseInt(cpf.charAt(i))
                    * (11 - i);
            }

            resto = 11 - (soma % 11);

            if (resto >= 10) {
                resto = 0;
            }

            if (
                resto !==
                parseInt(cpf.charAt(10))
            ) {

                campoCPF.style.border =
                    '2px solid red';

                erroCPF.style.display =
                    'block';

                return false;
            }

            campoCPF.style.border =
                '2px solid green';

            erroCPF.style.display =
                'none';

            return true;
        }

        document
            .getElementById('cpf')
            .addEventListener(
                'blur',
                validarCPF
            );

   function formatarRG(input) {

        let rg = input.value;

        rg = rg.toUpperCase();

        rg = rg.replace(/[^0-9X]/g, '');

        rg = rg.substring(0, 9);

        if (rg.length > 2) {
            rg = rg.replace(
                /^(\d{2})(\d)/,
                '$1.$2'
            );
        }

        if (rg.length > 6) {
            rg = rg.replace(
                /^(\d{2})\.(\d{3})(\d)/,
                '$1.$2.$3'
            );
        }

        if (rg.length > 10) {
            rg = rg.replace(
                /^(\d{2})\.(\d{3})\.(\d{3})([0-9X])/,
                '$1.$2.$3-$4'
            );
        }

        input.value = rg;
    } 
    
    document
        .getElementById('rg')
        .addEventListener('blur', validarRG);

    function validarRG() {

        const campoRG =
            document.getElementById('rg');

        const erroRG =
            document.getElementById('rgErro');

        let rg = campoRG.value;

        rg = rg.replace(/[^0-9X]/g, '');

        if (rg.length < 8) {

            campoRG.style.border =
                '2px solid red';

            erroRG.style.display =
                'block';

            return false;
        }

        campoRG.style.border =
            '2px solid green';

        erroRG.style.display =
            'none';

        return true;
    }
    </script>

</body>

</html>
