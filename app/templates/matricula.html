<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Matrícula | Alfa Cursos</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

   
    <!-- ========================= -->
    <!-- FORMULÁRIO -->
    <!-- ========================= -->

    <section class="matricula-section">

        <div class="matricula-container">

            <h1>
                Faça sua Matrícula
            </h1>

            <p>
                Preencha os dados abaixo para iniciar sua jornada.
            </p>

            <form action="/matricula" method="POST">

                <!-- NOME -->
                <div class="form-group">

                    <label>
                        Nome Completo
                    </label>

                    <input
                        type="text"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                </div>

                <!-- EMAIL -->
                <div class="form-group">

                    <label>
                        E-mail
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                </div>

                <!-- TELEFONE -->
                <div class="form-group">

                    <label>
                        Telefone
                    </label>

                    <input
                        type="text"
                        name="telefone"
                        placeholder="(12) 98765-4321"
                        maxlength="15"
                        required
                        oninput="formatarTelefone(this)"
                    >

                </div>

                <!-- DATA NASCIMENTO -->
                <div class="form-group">

                    <label>
                        Data de Nascimento
                    </label>

                    <input
                        type="date"
                        name="data_nascimento"
                        required
                    >

                </div>

                <!-- CURSO -->
                <div class="form-group">

                    <label>
                        Curso Desejado
                    </label>

                    <select name="curso" required>

                        <option value="">
                            Selecione um curso
                        </option>

                        <option value="1">
                            Inglês Instrumental e Fluência
                        </option>

                        <option value="2">
                            Informática Essencial
                        </option>

                        <option value="3">
                            Preparatório ENEM
                        </option>

                        <option value="4">
                            Excel Avançado para Negócios
                        </option>

                    </select>

                </div>

                <!-- BOTÃO -->
                <button type="submit" class="btn-form">
                    Finalizar Matrícula
                </button>

            </form>

        </div>

    </section>

    <!-- ========================= -->
    <!-- RODAPÉ -->
    <!-- ========================= -->

    <footer class="footer">

        <p>
            © 2026 Alfa Cursos - Todos os direitos reservados
        </p>

    </footer>

    <script>

    function formatarTelefone(input) {

        let telefone = input.value;

        telefone = telefone.replace(/\D/g, '');

        telefone = telefone.substring(0, 11);

        telefone = telefone.replace(
            /^(\d{2})(\d)/g,
            '($1) $2'
        );

        telefone = telefone.replace(
            /(\d{5})(\d)/,
            '$1-$2'
        );

        input.value = telefone;
    }

</script>

</body>

</html>
